services:
  - type: web
    name: hosting-bot-control-plane
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22

  - type: worker
    name: hosting-bot-telegram-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.bot
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
